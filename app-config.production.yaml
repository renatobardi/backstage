# Produção do oute (backstage-prd). Carregado junto com app-config.yaml:
#   node packages/backend --config app-config.yaml --config app-config.production.yaml
# Nenhum segredo aqui: tudo entra por env var ou arquivo montado pelo install (ADR-0002).
# Listas (ex.: catalog.locations) substituem as do app-config.yaml, então os exemplos não entram.

app:
  baseUrl: https://backstage.oute.pro

backend:
  baseUrl: https://backstage.oute.pro
  listen: ':7007'
  cors:
    origin: https://backstage.oute.pro

  # Automação (oute-infra-ops) lê o catálogo pelo listener da tailnet, com token próprio
  # restrito a leitura do catálogo (ADR-0005).
  auth:
    externalAccess:
      - type: static
        options:
          token: ${OUTE_INFRA_OPS_CATALOG_TOKEN}
          subject: oute-infra-ops
        accessRestrictions:
          - plugin: catalog
            permission:
              - catalog.entity.read

  # Schemas backstage_* no oute-supabase-db, database postgres (ADR-0003, ADR-0010).
  database:
    client: pg
    pluginDivisionMode: schema
    schemaPrefix: backstage_
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: postgres

# Uma GitHub App (oute-backstage), instalada na conta renatobardi (ADR-0016).
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          # PEM multilinha; o install grava entre aspas no .env do compose.
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners:
            - renatobardi

# Login só via oauth2-proxy + Google; exige User no oute-catalog com o email (ADR-0011, ADR-0017).
auth:
  environment: production
  providers:
    oauth2Proxy:
      signIn:
        resolvers:
          - resolver: emailMatchingUserEntityProfileEmail

catalog:
  locations:
    # Org e infraestrutura (ADR-0002, ADR-0013): uma entidade por arquivo.
    - type: url
      target: https://github.com/renatobardi/oute-catalog/blob/main/entities/*/*.yaml
      rules:
        - allow: [User, Group, System, Component, Resource, Location]
  providers:
    # Apps: catalog-info.yaml de cada repo da conta renatobardi (ADR-0002).
    github:
      renatobardi:
        organization: renatobardi
        catalogPath: /catalog-info.yaml
        # Só cria a Location de repos que têm o catalog-info.yaml (sem Location vazia por repo).
        validateLocationsExist: true
        filters:
          allowForks: false
          allowArchived: false
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
